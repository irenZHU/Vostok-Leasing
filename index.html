<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Концепция ребрендинга — Восток-Лизинг</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="page-home">
<main class="wrap" id="brand">
  <section class="hero hero--switch">
    <div>
      <h1>Концепция ребрендинга</h1>
      <div class="updated">Обновлено [дата]</div>
      <div class="hero-text">
        <p>Эволюция существующего знака, а не новый символ. Сохраняем сферу, движение и фирменный синий — и убираем визуальную сложность, чтобы знак стал чище и современнее для цифровой среды.</p>
      </div>
    </div>
    <!-- Переключатель направлений логотипа: меняет содержимое карточек ниже -->
    <div class="switch" data-dir-switch role="tablist" aria-label="Направления логотипа">
      <button role="tab" title="Направление 1" aria-label="Направление 1">01</button>
      <button role="tab" title="Направление 2" aria-label="Направление 2">02</button>
      <button role="tab" title="Направление 3" aria-label="Направление 3">03</button>
    </div>
  </section>

  <div class="cards">
    <a class="card card--third" href="logo.html">
      <div><div class="num">01</div><h2>Логотип и знак</h2></div>
      <img class="card-sign" src="assets/logo-new/sign-new.png" alt="" aria-hidden="true">
    </a>
    <a class="card card--third card--dark card--grad" href="colors.html">
      <div><div class="num">02</div><h2>Цвета</h2></div>
    </a>
    <a class="card card--third" href="fonts.html">
      <div><div class="num">03</div><h2>Шрифты</h2></div>
      <div class="card-art card-font">Аа</div>
    </a>
  </div>
</main>
<script src="assets/layout.js"></script>
</body>
</html>
